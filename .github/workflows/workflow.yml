name: Build and deploy

on:
  push:
    branches:
      - "*"
    tags:
      - v*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: build dist
        run: |
          ./dist.sh
          ls -la

      - name: create release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          artifacts: "adguardcert-*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          prerelease: ${{ contains(github.ref, '-') }}

      - name: write PR url
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.html_url }}" > pull_request_url.txt

      - name: upload artifact
        uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: adguardcert module build
          path: |
            adguardcert-*.zip
            README.md
            pull_request_url.txt

      - name: update json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com>"
          git config user.name "github-actions[bot]"
          git fetch origin
          ./update.sh
          if git diff --quiet origin/master HEAD; then
            echo "update.json is already up to date"
            exit 0
          fi
          branch="update-json/${GITHUB_REF_NAME}"
          git checkout -b "${branch}"
          git push --force origin "${branch}"
          gh pr create \
            --base master \
            --head "${branch}" \
            --title "Update update.json for ${GITHUB_REF_NAME}" \
            --body "Automated update.json update for the ${GITHUB_REF_NAME} release." \
            || echo "Pull request for ${branch} already exists"
          ls -la
